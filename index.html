<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify you are human</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202124;
  background:#f1f3f4;display:grid;place-items:center;padding:20px;overflow:hidden;
}
.wrap{width:min(360px,100%);text-align:center}
.prompt{font-size:14px;color:#5f6368;margin:0 0 14px}
.widget{
  width:100%;height:100px;display:flex;background:#f9f9f9;
  border:1px solid #d3d3d3;border-radius:4px;box-shadow:0 0 4px rgba(0,0,0,.08);
  transition:border-color .3s,background .3s;
}
.widget.done{border-color:#0f9d58;background:#f0faf4}
.arena{position:relative;flex:1;touch-action:none;margin-left:12px}
.cb-row{
  position:absolute;left:0;top:50%;margin-top:-14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;
  transition:left .3s cubic-bezier(.2,.9,.3,1.2),top .3s cubic-bezier(.2,.9,.3,1.2);
  white-space:nowrap;font-size:14px;
}
.box{
  width:28px;height:28px;border:2px solid #c1c1c1;border-radius:2px;background:#fff;
  display:grid;place-items:center;flex:none;color:#fff;font-size:18px;font-weight:700;
}
.widget.done .box{background:#0f9d58;border-color:#0f9d58}
.logo{
  width:86px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:10px;color:#5f6368;padding-right:6px;
}
.shield{
  width:30px;height:30px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  background:linear-gradient(160deg,#4285f4,#1a73e8);color:#fff;display:grid;place-items:center;
  font-size:16px;font-weight:700;
}
.brand{font-weight:600;color:#3c4043;font-size:11px}
.links{font-size:9px;color:#80868b}
.status{font-size:13px;color:#5f6368;min-height:1.4em;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <p class="prompt">Please confirm you are not a robot to continue.</p>
  <div class="widget" id="widget">
    <div class="arena" id="arena">
      <div class="cb-row" id="cb" role="checkbox" aria-checked="false" tabindex="0">
        <div class="box" id="box"></div>
        <span>I'm not a robot</span>
      </div>
    </div>
    <div class="logo">
      <div class="shield" aria-hidden="true">✓</div>
      <div class="brand">Human Check</div>
      <div class="links">Privacy · Terms</div>
    </div>
  </div>
  <p class="status" id="status">Click the box to verify.</p>
</div>

<script>
const arena  = document.getElementById('arena');
const cb     = document.getElementById('cb');
const box    = document.getElementById('box');
const widget = document.getElementById('widget');
const status = document.getElementById('status');

const NOTES = ['Click the box to verify.','That was close.','The box has somewhere to be.',
               'Still moving.','Nice try, robot.','The box is not interested.',
               'Almost. Maybe.','Hold still, human.','One more attempt.','It really does not want to be checked.'];
const FREE_AFTER = 8;
let dodges = 0, free = false, verifying = false, lastDodge = 0;

function place(px = null, py = null){
  const aw = arena.clientWidth, ah = arena.clientHeight;
  const bw = cb.offsetWidth, bh = cb.offsetHeight;
  let x, y, t = 0;
  do {
    x = Math.random() * Math.max(0, aw - bw);
    y = Math.random() * Math.max(0, ah - bh);
    t++;
  } while (px != null && Math.hypot(x + bw/2 - px, y + bh/2 - py) < 110 && t < 20);
  cb.style.left = x + 'px';
  cb.style.top  = (y + bh/2) + 'px';
}

function dodge(px = null, py = null){
  if (free || verifying) return;
  const now = Date.now();
  if (now - lastDodge < 300) return;
  lastDodge = now;
  dodges++;
  status.textContent = NOTES[Math.min(dodges, NOTES.length - 1)];
  place(px, py);
  if (dodges >= FREE_AFTER) free = true;
}

// Desktop: the box flees the cursor when it gets close
arena.addEventListener('pointermove', e=>{
  if (free || verifying || e.pointerType !== 'mouse') return;
  const r = arena.getBoundingClientRect();
  const b = cb.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const cx = b.left + b.width/2 - r.left, cy = b.top + b.height/2 - r.top;
  if (Math.hypot(px - cx, py - cy) < 70) dodge(px, py);
});

// Mobile: moves the moment a finger lands
cb.addEventListener('touchstart', e=>{
  if (!free && !verifying) { e.preventDefault(); dodge(); }
}, { passive:false });

cb.addEventListener('click', ()=>{
  if (verifying) return;
  if (!free) { dodge(); return; }
  verify();
});

function verify(){
  verifying = true;
  status.textContent = 'Verifying…';
  setTimeout(()=>{
    box.textContent = '✓';
    cb.setAttribute('aria-checked', 'true');
    widget.classList.add('done');
    status.textContent = 'Verified. You are probably human. Redirecting…';
    setTimeout(()=>{ window.location.href = 'cookie-consent.html'; }, 1600);
  }, 1400);
}

window.addEventListener('load', ()=>place());
window.addEventListener('resize', ()=>{ if (!free && !verifying) place(); });
</script>
</body>
</html>
